name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Astro 7 requires Node 22.12+; keep the major pinned for reproducibility.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      # PUBLIC_* values are inlined at build time, so the FormSubmit hash must reach
      # this step — setting the secret alone changes nothing in the output. The
      # secret keeps its original name so the repository settings need no change.
      - run: npm run build
        env:
          PUBLIC_CONTACT_FORM_ID: ${{ secrets.NEXT_PUBLIC_CONTACT_FORM_ID }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
